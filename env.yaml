
# File environment.yml
# Run with: conda env create -f environment.yml

name: cmria
channels:
  - conda-forge
  - defaults
  - pytorch
dependencies:
  - python=3.9
  - pip
  - tqdm
  - cudatoolkit=11.2
  - cudnn=8.1.0
  - pytorch
  - torchvision
  - matplotlib
  - scipy
  - pip:
      - tensorboardX
      - opencv-python
      - nibabel
      - open3d
      - paramiko

